[project]
name = "stock-pipeline"
version = "1.0.0"
description = "Dockerized stock market data pipeline (Finnhub -> Dagster -> PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "dagster",
    "dagster-webserver",
    "requests",
    "psycopg[binary]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stock_pipeline*"]
